<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Maidan POS</title>
<meta name="description" content="Restaurant management system: floor plan, orders, kitchen display, inventory, customers and reports. Arabic-first with an English toggle.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
:root{
  --f-disp:"Alexandria","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  --f-mono:"IBM Plex Mono",Consolas,monospace;
  --bg:#eceae5; --surface:#fffefc; --surface-2:#f4f2ee; --line:#dcd8d0;
  --ink:#16181a; --ink-2:#4e545a; --ink-3:#7e858d;
  --accent:#0d7350; --accent-ink:#fff; --accent-soft:#d9efe5;
  --free:#0d7350; --free-soft:#d9efe5; --busy:#a9621a; --busy-soft:#f8ecd9;
  --ready:#1f5fa8; --ready-soft:#dde9f8; --hot:#b23125; --hot-soft:#fadfdc;
  --grill:#b23125; --kitchen:#a9621a; --bar:#1f5fa8;
  --shadow:0 16px 44px rgba(20,22,25,.2);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e100f; --surface:#171a19; --surface-2:#1d211f; --line:#2a2f2c;
    --ink:#e9ecea; --ink-2:#a6aead; --ink-3:#727b79;
    --accent:#37c390; --accent-ink:#0b1410; --accent-soft:#12291f;
    --free:#37c390; --free-soft:#12291f; --busy:#e0a052; --busy-soft:#2e2312;
    --ready:#6ea8ef; --ready-soft:#13233a; --hot:#ef7b6e; --hot-soft:#331715;
    --grill:#ef7b6e; --kitchen:#e0a052; --bar:#6ea8ef;
    --shadow:0 16px 44px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e100f; --surface:#171a19; --surface-2:#1d211f; --line:#2a2f2c;
  --ink:#e9ecea; --ink-2:#a6aead; --ink-3:#727b79;
  --accent:#37c390; --accent-ink:#0b1410; --accent-soft:#12291f;
  --free:#37c390; --free-soft:#12291f; --busy:#e0a052; --busy-soft:#2e2312;
  --ready:#6ea8ef; --ready-soft:#13233a; --hot:#ef7b6e; --hot-soft:#331715;
  --grill:#ef7b6e; --kitchen:#e0a052; --bar:#6ea8ef;
  --shadow:0 16px 44px rgba(0,0,0,.6);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.sp{flex:1}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:14px;padding:10px clamp(12px,2.4vw,24px);flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px}
.mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font:700 15px/1 var(--f-disp);flex:none}
.brand b{font:700 17px/1.1 var(--f-disp);display:block}
.brand small{color:var(--ink-3);font-size:11.5px}
nav{display:flex;gap:3px;overflow-x:auto;scrollbar-width:thin}
nav button{all:unset;box-sizing:border-box;cursor:pointer;padding:8px 13px;border-radius:9px;font-weight:600;font-size:14px;color:var(--ink-2);white-space:nowrap;display:flex;align-items:center;gap:7px;transition:background-color .18s,color .18s}
nav button:hover{background:var(--surface-2);color:var(--ink)}
nav button[aria-current="page"]{background:var(--ink);color:var(--surface)}
nav .pill{font-size:11.5px;background:var(--hot);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
nav button[aria-current="page"] .pill{background:var(--surface);color:var(--ink)}
.clock{font:500 14px var(--f-mono);color:var(--ink-2)}

main{padding:20px clamp(12px,2.4vw,24px) 60px}
h1{font:700 26px/1.15 var(--f-disp);margin:0 0 16px}
.hd{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.hd h1{margin:0}

/* buttons */
.btn{font-weight:600;font-size:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:9px 15px;border-radius:9px;cursor:pointer;display:inline-flex;gap:7px;align-items:center;justify-content:center;white-space:nowrap;text-decoration:none;transition:transform .16s var(--ease),border-color .18s,background-color .18s}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.sm{padding:6px 11px;font-size:13px}
.btn.lg{padding:13px 20px;font-size:16px}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--hot)}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.fld{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:9px 12px;width:100%;min-width:0}
.fld:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
textarea.fld{resize:vertical;min-height:64px}
label.f{display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2)}

/* chips & cards */
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.chip.free{background:var(--free-soft);color:var(--free)}
.chip.busy{background:var(--busy-soft);color:var(--busy)}
.chip.ready{background:var(--ready-soft);color:var(--ready)}
.chip.hot{background:var(--hot-soft);color:var(--hot)}
.dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none;display:inline-block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h2{font:700 15px/1.3 var(--f-body);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.panel h2 .c{color:var(--ink-3);font-weight:500;font-size:13px}
.empty{color:var(--ink-3);padding:16px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.stat .k{font-size:12.5px;color:var(--ink-2);font-weight:600}
.stat .v{font:700 30px/1.15 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:3px}
.stat .s{font-size:12px;color:var(--ink-3)}
.grid2{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px;align-items:start}

/* floor */
.zones{display:flex;gap:6px;flex-wrap:wrap}
.zones button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.zones button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.tables{display:grid;grid-template-columns:repeat(auto-fill,minmax(178px,1fr));gap:12px}
.table{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:9px;min-height:132px;position:relative;transition:transform .2s var(--ease),border-color .2s,box-shadow .2s}
.table:hover{transform:translateY(-3px);box-shadow:0 10px 24px -16px rgba(0,0,0,.4)}
.table:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.table .no{font:700 30px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.table .seats{font-size:12.5px;color:var(--ink-3)}
.table.busy{border-color:var(--busy)}
.table.ready{border-color:var(--ready);box-shadow:inset 0 0 0 1px var(--ready)}
.table .tot{font:700 17px/1 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:auto}
.table .mins{font:500 12.5px var(--f-mono);color:var(--ink-3)}
.table .mins.late{color:var(--hot)}

/* POS order screen */
.pos{display:grid;grid-template-columns:minmax(0,1fr) 372px;gap:14px;align-items:start}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.cats button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;font-size:13.5px;font-weight:600;cursor:pointer;color:var(--ink-2)}
.cats button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(154px,1fr));gap:10px}
.item{all:unset;box-sizing:border-box;cursor:pointer;background:var(--surface);border:1px solid var(--line);border-radius:13px;padding:13px;display:flex;flex-direction:column;gap:6px;min-height:96px;transition:transform .16s var(--ease),border-color .18s}
.item:hover{transform:translateY(-2px);border-color:var(--accent)}
.item:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.item b{font-size:14.5px;line-height:1.3}
.item .p{margin-top:auto;font:700 16px/1 var(--f-disp);font-variant-numeric:tabular-nums}
.item .st{position:absolute}
.item.off{opacity:.45;cursor:not-allowed}
.item-h{display:flex;align-items:center;gap:7px;justify-content:space-between}
.ticket{background:var(--surface);border:1px solid var(--line);border-radius:16px;position:sticky;top:76px;display:flex;flex-direction:column;max-height:calc(100dvh - 96px)}
.ticket .th{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ticket .th b{font:700 17px/1 var(--f-disp)}
.lines{overflow-y:auto;padding:6px 16px;flex:1;min-height:120px}
.line{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lines .line:first-child{border-top:0}
.qty{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.qty button{all:unset;cursor:pointer;width:26px;height:28px;display:grid;place-items:center;font-weight:700;color:var(--ink-2)}
.qty button:hover{background:var(--surface-2);color:var(--ink)}
.qty span{min-width:24px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px}
.line .nm{font-weight:600;font-size:14.5px}
.line .note{font-size:12px;color:var(--ink-3)}
.line .pr{font-weight:700;font-variant-numeric:tabular-nums;text-align:end}
.line.sent .nm::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--busy);margin-inline-start:7px;vertical-align:middle}
.line.ready .nm::after{background:var(--ready)}
.totals{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:6px;font-size:14px}
.totals div{display:flex;justify-content:space-between;gap:10px}
.totals .big{font:700 22px/1.2 var(--f-disp);font-variant-numeric:tabular-nums;padding-top:6px;border-top:1px dashed var(--line);margin-top:4px}
.tactions{padding:12px 16px;border-top:1px solid var(--line);display:grid;gap:8px;grid-template-columns:1fr 1fr}
.tactions .full{grid-column:1/-1}

/* kitchen */
.kds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.kcol h2{font:700 15px/1 var(--f-body);margin:0 0 10px;display:flex;justify-content:space-between;color:var(--ink-2)}
.kcol .stack{display:grid;gap:10px}
.kt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line));border-radius:12px;padding:13px 15px;display:grid;gap:8px}
[dir="rtl"] .kt{border-left:1px solid var(--line);border-right:4px solid var(--c,var(--line))}
.kt .kh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.kt .kh b{font:700 16px/1 var(--f-disp)}
.kt ul{margin:0;padding:0;list-style:none;display:grid;gap:5px;font-size:14.5px}
.kt li{display:flex;gap:8px;align-items:baseline}
.kt li b{font-variant-numeric:tabular-nums;font-family:var(--f-mono);font-size:13.5px}
.kt li em{font-style:normal;font-size:12.5px;color:var(--hot)}
.kt .mins{font:500 13px var(--f-mono);color:var(--ink-3)}
.kt .mins.late{color:var(--hot);font-weight:700}
.kt.late{--c:var(--hot)}

/* tables & lists */
.tw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:start;font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.03em;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:var(--surface-2)}
td.end,th.end{text-align:end}
.bar2{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;min-width:90px}
.bar2 span{display:block;height:100%;background:var(--c)}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.grow{flex:1;min-width:0}
.meta{font-size:12.5px;color:var(--ink-3)}
.mono{font-family:var(--f-mono);font-size:12.5px}
.acts{display:flex;gap:6px;flex-wrap:wrap}

/* tickets list */
.tks{display:grid;grid-template-columns:repeat(auto-fill,minmax(258px,1fr));gap:12px}
.tk{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:15px;display:flex;flex-direction:column;gap:8px;cursor:pointer;transition:transform .18s var(--ease),border-color .2s}
.tk:hover{transform:translateY(-3px);border-color:var(--accent)}
.tk .tkh{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tk b{font:700 16px/1 var(--f-disp)}
.tk .tot{font:700 19px/1 var(--f-disp);font-variant-numeric:tabular-nums;margin-top:auto}

/* chart */
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--ink-3);font:11px var(--f-body)}
.mix{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:14px}

/* dialog */
dialog{border:0;border-radius:16px;padding:0;background:var(--surface);color:var(--ink);width:min(560px,calc(100% - 28px));max-height:calc(100dvh - 32px);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(10,12,11,.55)}
dialog[open]{animation:pop .22s var(--ease)}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.985)}}
.dh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line)}
.dh h3{margin:0;font:700 19px/1.2 var(--f-disp)}
.db{padding:18px 20px;overflow-y:auto}
.df{display:flex;gap:8px;justify-content:flex-end;padding:13px 20px;border-top:1px solid var(--line);flex-wrap:wrap}
.form{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form .full{grid-column:1/-1}
.x{width:34px;height:34px;padding:0;font-size:20px;line-height:1}
.pays{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pays button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:12px;font-weight:700;cursor:pointer}
.pays button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.keypad button{border:1px solid var(--line);background:var(--surface);border-radius:11px;padding:13px;font:700 17px var(--f-mono);cursor:pointer}
.keypad button:active{background:var(--surface-2)}
.due{display:flex;justify-content:space-between;align-items:baseline;font:700 21px var(--f-disp);font-variant-numeric:tabular-nums;padding:12px 0}
.change{color:var(--accent)}

/* receipt */
.receipt{background:#fff;color:#111;font-family:var(--f-mono);font-size:12.5px;line-height:1.6;padding:18px;border-radius:10px;max-width:330px;margin-inline:auto;border:1px solid var(--line)}
.receipt h4{font:700 16px var(--f-disp);text-align:center;margin:0 0 2px}
.receipt .c{text-align:center}
.receipt hr{border:0;border-top:1px dashed #aaa;margin:9px 0}
.receipt .r{display:flex;justify-content:space-between;gap:10px}
.receipt .tot{font-weight:700;font-size:14px}

#toast{position:fixed;inset-inline:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none;z-index:100;padding-inline:14px}
.t{background:var(--ink);color:var(--surface);padding:10px 16px;border-radius:10px;font-weight:600;font-size:14px;box-shadow:var(--shadow);animation:tin .2s ease-out}
.t.err{background:var(--hot);color:#fff}
.t.ok{background:var(--accent);color:var(--accent-ink)}
@keyframes tin{from{transform:translateY(8px);opacity:.2}}

@media (max-width:1050px){ .pos{grid-template-columns:minmax(0,1fr)} .ticket{position:static;max-height:none} .grid2{grid-template-columns:minmax(0,1fr)} .kds{grid-template-columns:minmax(0,1fr)} }
@media (max-width:560px){ .form{grid-template-columns:1fr} .top .in{gap:10px} .brand small{display:none} }
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{ body *{visibility:hidden} #dlg,#dlg *{visibility:visible} #dlg{position:absolute;inset:0;box-shadow:none;width:auto} .dh,.df{display:none} .receipt{border:0} }
</style>
</head>
<body>
<header class="top"><div class="in">
  <div class="brand"><span class="mark" id="mark">M</span><div><b id="rname"></b><small id="rsub"></small></div></div>
  <nav id="nav"></nav>
  <span class="sp"></span>
  <span class="clock" id="clock"></span>
  <button class="btn" data-act="lang" id="langb"></button>
</div></header>
<main id="view"></main>
<dialog id="dlg"></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Math.random().toString(36).slice(2, 10);
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const today = () => iso(new Date());
const parse = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').toLowerCase().replace(/[ً-ْـ]/g, '').replace(/[أإآ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').trim();
const hhmm = ts => { const d = new Date(ts); return pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const mins = ts => Math.max(0, Math.floor((Date.now() - ts) / 60000));
const round = n => Math.round(n * 100) / 100;

/* ---------- i18n ---------- */
const D = {
  ar: {
    sub: 'نظام إدارة المطعم', cur: 'ج.م', langBtn: 'English',
    nav_floor: 'الصالة', nav_tickets: 'طلبات خارجية', nav_kitchen: 'المطبخ', nav_menu: 'المنيو', nav_stock: 'المخزن', nav_customers: 'العملاء', nav_reports: 'التقارير', nav_settings: 'الإعدادات',
    st_free: 'فاضية', st_busy: 'مشغولة', st_ready: 'جاهز للتقديم',
    seats: n => `${n} كراسي`, table: n => `ترابيزة ${n}`, minsAgo: n => `${n} دقيقة`,
    s_open: 'ترابيزات مشغولة', s_ready: 'طلبات جاهزة', s_sales: 'مبيعات النهارده', s_orders: 'عدد الطلبات', s_avg: 'متوسط الفاتورة', s_low: 'أصناف تحت الحد',

function tableState(tb) {
  const o = orderOfTable(tb.id);
  if (!o) return 'free';
  return o.lines.some(l => l.status === 'ready') ? 'ready' : 'busy';
}
function totals(o) {
  const sub = o.lines.reduce((s, l) => s + l.price * l.qty, 0);
  const service = o.type === 'dine' ? sub * S.settings.service / 100 : 0;
  const vat = (sub + service) * S.settings.vat / 100;
  const dlv = o.type === 'delivery' ? S.settings.deliveryFee : 0;
  const total = Math.max(0, sub + service + vat + dlv - (o.discount || 0));
  return { sub, service, vat, dlv, total };
}
const orderTitle = o => o.type === 'dine' ? t('table', getTable(o.tableId)?.no ?? '—') : t('ord_' + o.type);
function deduct(line) {
  const it = getItem(line.itemId); if (!it) return;
  (it.recipe || []).forEach(([ingId, qty]) => {
    const ing = getIng(ingId); if (!ing) return;
    ing.stock = round(Math.max(0, ing.stock - qty * line.qty));
    if (ing.stock <= 0) toast(t('t_outStock', L(ing.name)), 'err');
    else if (ing.stock < ing.min) toast(t('t_lowStock', L(ing.name)));
  });
}
const lowStock = () => S.ingredients.filter(i => i.stock < i.min);
const paidOn = date => S.orders.filter(o => o.status === 'paid' && o.date === date);
const salesOf = list => list.reduce((s, o) => s + totals(o).total, 0);

/* reports */
function vReports() {
  const paid = paidOn(today()), sales = salesOf(paid);
  const days = [...Array(7)].map((_, i) => addDays(today(), i - 6));
  const vals = days.map(d => salesOf(paidOn(d)));
  const types = ['dine', 'take', 'delivery'].map(k => ({ k, v: salesOf(paid.filter(o => o.type === k)), n: paid.filter(o => o.type === k).length }));
  const pays = METHODS.map(k => ({ k, v: salesOf(paid.filter(o => o.method === k)) })).filter(x => x.v);
  const best = {};
  paid.forEach(o => o.lines.forEach(l => { const b = best[l.itemId] = best[l.itemId] || { name: l.name, qty: 0, sum: 0 }; b.qty += l.qty; b.sum += l.qty * l.price; }));
  const top = Object.values(best).sort((a, b) => b.qty - a.qty).slice(0, 6);
  const hours = [...Array(13)].map((_, i) => ({ h: i + 11, v: paid.filter(o => new Date(o.closed).getHours() === i + 11).length }));
  const mxT = Math.max(1, ...types.map(x => x.v)), mxP = Math.max(1, ...pays.map(x => x.v)), mxB = Math.max(1, ...top.map(x => x.qty)), mxH = Math.max(1, ...hours.map(x => x.v));
  const bars = (list, mx, label, val, color) => `<div class="mix">${list.map(x => `<span>${label(x)}</span><div class="bar2"><span style="width:${val(x) / mx * 100}%;--c:${color}"></span></div><b class="num">${val(x) ? (typeof val(x) === 'number' && val(x) > 999 ? Math.round(val(x) / 1000) + 'k' : Math.round(val(x))) : 0}</b>`).join('')}</div>`;
  return `<div class="hd"><h1>${t('nav_reports')}</h1></div>
  <div class="stats">
    <div class="stat"><div class="k">${t('s_sales')}</div><div class="v">${Math.round(sales).toLocaleString('en-US')}<small style="font-size:15px;color:var(--ink-3)"> ${t('cur')}</small></div></div>
    <div class="stat"><div class="k">${t('s_orders')}</div><div class="v">${paid.length}</div></div>
    <div class="stat"><div class="k">${t('s_avg')}</div><div class="v">${paid.length ? Math.round(sales / paid.length).toLocaleString('en-US') : 0}<small style="font-size:15px;color:var(--ink-3)"> ${t('cur')}</small></div></div>
    <div class="stat"><div class="k">${t('s_low')}</div><div class="v" style="${lowStock().length ? 'color:var(--hot)' : ''}">${lowStock().length}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h2>${t('r_week')}</h2>${weekChart(days, vals)}</div>
    <div class="panel"><h2>${t('r_type')}</h2>${bars(types, mxT, x => `${t('ord_' + x.k)} <span class="meta">(${x.n})</span>`, x => x.v, 'var(--accent)')}</div>
  </div>
  <div class="grid2" style="margin-top:14px">
    <div class="panel"><h2>${t('r_best')}</h2>${top.length ? bars(top, mxB, x => esc(L(x.name)), x => x.qty, 'var(--busy)') : `<div class="empty">${t('r_none')}</div>`}</div>
    <div class="panel"><h2>${t('r_pay')}</h2>${pays.length ? bars(pays, mxP, x => t('pay_' + x.k), x => x.v, 'var(--ready)') : `<div class="empty">${t('r_none')}</div>`}</div>
  </div>
  <div class="panel" style="margin-top:14px"><h2>${t('r_hours')}</h2>${bars(hours, mxH, x => `<span class="mono">${pad(x.h)}:00</span>`, x => x.v, 'var(--accent)')}</div>`;
}
function weekChart(days, vals) {
  const mx = Math.max(100, ...vals), W = 560, H = 190, l = 38, b = 26, tp = 12, bw = (W - l - 6) / 7, y = v => tp + (H - tp - b) * (1 - v / mx);
  let g = '';
  for (let i = 0; i <= 2; i++) { const v = mx / 2 * i; g += `<line x1="${l}" x2="${W - 6}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${l - 6}" y="${y(v) + 4}" text-anchor="end">${Math.round(v / 1000)}k</text>`; }
  const bars = vals.map((v, i) => { const x = l + i * bw + bw * .2, w = bw * .6, isT = i === 6;
    return `<rect x="${x}" y="${y(v)}" width="${w}" height="${Math.max(0, y(0) - y(v))}" rx="4" fill="${isT ? 'var(--accent)' : 'var(--accent-soft)'}"/>
      <text x="${x + w / 2}" y="${H - b + 15}" text-anchor="middle" ${isT ? 'style="fill:var(--ink);font-weight:700"' : ''}>${fmtD(days[i])}</text>`; }).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" direction="ltr" role="img" aria-label="${t('r_week')}">${g}${bars}</svg>`;
}

  'f-recv': (d, id) => { const i = getIng(id); i.stock = round(i.stock + Number(d.qty || 0)); i.cost = Number(d.cost || i.cost); closeDlg(); toast(t('t_saved'), 'ok'); refresh(); },
  'f-cust': (d, id) => {
    const v = { name: d.name.trim(), phone: d.phone.trim(), address: d.address.trim(), notes: d.notes.trim() };
    let c;
    if (id) { c = getCust(id); Object.assign(c, v); } else { c = { id: 'u' + uid(), ...v }; S.customers.push(c); }
    closeDlg(); toast(t('t_saved'));
    const then = ui.afterCustomer; ui.afterCustomer = null;
    if (then) then(c); else refresh();
  },
  'f-note': (d, id) => { const o = getOrder(ui.orderId), l = o.lines.find(x => x.lid === id); l.note = d.note.trim(); closeDlg(); refresh(); },
  'f-table': d => { S.tables.push({ id: 'T' + uid(), no: Number(d.no), seats: Number(d.seats), zone: d.zone }); closeDlg(); toast(t('t_saved')); refresh(); },
  'f-set': d => {
    Object.assign(S.settings, { name: d.name.trim(), nameEn: d.nameEn.trim(), phone: d.phone.trim(), address: d.address.trim(), vat: Number(d.vat), service: Number(d.service), deliveryFee: Number(d.deliveryFee), lang: d.lang });
    applyLang(); toast(t('t_saved')); refresh();
  },
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = A[el.dataset.act]; if (fn) { e.preventDefault(); fn(el.dataset.id, el, e); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target, fn = FORMS[f.id];
  if (fn) fn(Object.fromEntries(new FormData(f)), f.dataset.id);
});
document.addEventListener('input', e => {
  if (e.target.id === 'q') { ui.q = e.target.value; render(); }
  else if (e.target.id === 'paid') { ui.payInput = e.target.value.replace(/[^\d.]/g, ''); }
});
dlg.addEventListener('click', e => { if (e.target === dlg) closeDlg(); });

/* live clock + kitchen timers */
setInterval(() => {
  $('#clock').textContent = hhmm(Date.now());
  if (['kitchen', 'floor', 'tickets'].includes(ui.view) && !dlg.open) render();
}, 30000);

/* ---------- boot ---------- */
S = load();
applyLang();
render();
</script>
</body>
</html>
